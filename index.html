 else if(n==="sub"){S.plus=!S.plus;subSheet();render()}
 else if(n==="chat")chatOpen("s0","Служба поддержки")

 else if(n==="dsend"){var i=+S.dk.slice(1),ob=S.dk[0]==="c"?S.my[i]:S.mine[i];ob.disp=1;closeSheet();toast("Спор открыт, поддержка свяжется с вами");render()}
 else if(n==="tsend"){var o=S.my[S.tk],a=+$("tt").value;o.tip=a;o.rate=+$("tr").value;closeSheet();toast("Спасибо! "+(a?"Чаевые: "+rub(a):"Оценка отправлена"));render()}

var LM=null;
function pl(o){var q=wp(o);return q>=1000?f1(q/1000)+"к":q}
function mapFallback(l){var e=$("lmap");if(LM){LM.remove();LM=null}if(e)e.outerHTML='<div class="meta" style="margin-bottom:8px">Настоящая карта здесь не загрузилась (она работает на опубликованном сайте), показываю схему.</div>'+mapSvg(l)}
function initMap(){
 var e=$("lmap");if(!e)return;var l=flt().filter(function(o){return !o.rem});
 if(LM){LM.remove();LM=null}
 if(!l.length){e.innerHTML='<div class="empty">Заказов на месте нет, удалённые на карте не показываются.</div>';e.style.height="auto";return}if(typeof L==="undefined"){mapFallback(l);return}
 try{
  LM=L.map("lmap",{zoomControl:true}).setView([55.75,37.62],10);
  var bad=0,tl=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"}).addTo(LM);
  tl.on("tileerror",function(){if(++bad===3)mapFallback(l)});
  var pts=[];
  l.forEach(function(o){pts.push([o.la,o.lo]);L.marker([o.la,o.lo],{icon:L.divIcon({className:"",html:'<div class="mk'+(o.age===14?' t':'')+'">'+pl(o)+'</div>',iconSize:[46,26],iconAnchor:[23,13]})}).addTo(LM).on("click",function(){detail(o.id)})});
  LM.fitBounds(pts,{padding:[30,30],maxZoom:12});
 }catch(x){mapFallback(l)}
}
function render(){
 if(!S.role){openRole();return}
 var w=S.role==="worker";
 if(w&&S.tab==="my")S.tab="feed";if(!w&&(S.tab==="feed"||S.tab==="mine"||S.tab==="slots"))S.tab="my";
 var un=S.unread;if(S.tab==="bell")S.unread=0;
 $("app").innerHTML=S.tab==="feed"?feed():S.tab==="mine"?mineV():S.tab==="slots"?slotsV():S.tab==="my"?myV():S.tab==="bell"?bellV():profV();
 var it=w?[["feed",IC.feed,"Заказы"],["mine",IC.mine,"Мои"],["slots",IC.slots,"Слоты"],["bell",IC.bell,"События"],["prof",IC.prof,"Профиль"]]:[["my",IC.my,"Заказы"],["new","+",""],["bell",IC.bell,"События"],["prof",IC.prof,"Профиль"]];
 if(S.tab==="feed"&&S.view==="map")initMap();else if(LM){LM.remove();LM=null}
 $("nav").style.gridTemplateColumns="repeat("+it.length+",1fr)";
 $("nav").innerHTML=it.map(function(x){return x[0]==="new"?'<button class="plus" data-tab="new" aria-label="Создать заказ">+</button>':'<button class="'+(S.tab===x[0]?'on':'')+'" data-tab="'+x[0]+'"><span>'+x[1]+(x[0]==="bell"&&S.unread?'<b class="dot">'+S.unread+'</b>':'')+'</span>'+x[2]+'</button>'}).join("");
 trAll();
}
function openRole(){openSheet('<h2>Добро пожаловать в Дело</h2><div class="meta">Роль можно сменить в любой момент в профиле. Аккаунт один.</div><div style="height:14px"></div><button class="btn" data-role="customer">Хочу заказать</button><div style="height:10px"></div><button class="btn sec" data-role="worker">Хочу подработать</button>')}
function revList(l){return l.map(function(r){return '<div style="margin-top:14px"><div class="who">'+av(34)+'<div><b>'+esc(r[1])+'</b><div class="stars">'+stars(r[0])+'</div></div></div>'+(r[2]?'<div style="margin-top:6px">'+esc(r[2])+'</div>':'')+'</div>'}).join("")}
function revSheet(k){
 var l=k==="w"?WR:CU[3].rv,mk=function(r){return r.length===3?[r[0],r[1],r[2]]:r};
 openSheet('<h2>Отзывы</h2><div class="who">'+av(48)+'<div><h3 style="margin:0">Алексей К.</h3><div><span class="stars">★</span> '+f1(avg(l))+' · '+l.length+' '+(l.length<5?'отзыва':'отзывов')+'</div></div></div>'+revList(l));
}
function custSheet(i){
 var c=CU[i],a=avg(c.rv);
 openSheet('<h2>Заказчик</h2><div class="who">'+av(56)+'<div><h3 style="margin:0;font-size:19px">'+esc(c.n)+'</h3><div><span class="stars">★</span> '+f1(a)+' · '+c.rv.length+' '+(c.rv.length<5?'отзыва':'отзывов')+'</div></div></div><div class="note">Заказов создано: <b>'+c.o+'</b><br>Оценки от исполнителей ниже.'+(a<3.5?'<br><b>Низкий рейтинг: будьте внимательны.</b>':'')+'</div>'+revList(c.rv));
}
function detail(id){
 var o=orders.filter(function(x){return x.id===id})[0];if(!o)return;var w=S.role==="worker",c=CU[o.cu];
 openSheet('<h2>'+esc(o.t)+'</h2><div class="meta">'+esc(o.c)+' · '+esc(o.d)+'</div><div class="note"><b>Когда:</b> '+esc(o.dt)+', '+esc(o.w)+'<br><b>Адрес:</b> '+esc(o.ad)+''+(o.rem?'':'<br><b>Метро:</b> '+esc(o.st)+', '+o.m+' мин пешком')+'<br><b>Сложность:</b> '+o.cx+' из 10'+(o.ub>0?'<br><b>Срочный заказ:</b> оплата повышена':'')+'<br><b>Время на выполнение:</b> '+o.lim+' мин<br><b>Возраст исполнителя:</b> от '+o.age+' лет'+(o.need>1?'<br><b>Нужно исполнителей:</b> '+o.need:'')+(o.rp?'<br><b>Повтор:</b> '+esc(o.rp):'')+'<br><b>Страховка:</b> ущерб до 30 000 ₽ (демо)</div><p style="margin:0 0 6px">'+esc(o.x2)+'</p>'+(o.nt?'<p class="meta" style="margin:0 0 8px">Примечание заказчика: '+esc(o.nt)+'</p>':'')+'<div style="margin:10px 0"><span class="meta">Заказчик: </span><button class="lnk" data-cust="'+o.cu+'">'+esc(c.n)+' · ★ '+f1(avg(c.rv))+' ›</button></div><div class="row" style="align-items:center;margin-bottom:12px"><b>Ваша оплата</b><div class="price">'+rub(wp(o))+'</div></div>'+(w?(S.mine.some(function(m){return m.o.id===o.id})?'<button class="btn" disabled>Вы уже взяли этот заказ</button>':'<button class="btn" id="take">'+(o.need>1?'Вступить в команду':'Взять заказ')+'</button>'):'<div class="meta">Чтобы брать заказы, переключитесь на роль «Исполнитель» в профиле.</div>'));
 var tk=$("take");if(w&&tk)tk.onclick=function(){S.mine.push({o:Object.assign({},o),s:0,end:Date.now()+o.lim*60000});if(o.need>1){o.need--;toast("Вы в команде, осталось мест: "+o.need)}else{orders=orders.filter(function(x){return x.id!==id});toast("Заказ взят, таймер запущен")}closeSheet();render()};
}
function filterSheet(){
 function op(a,v){return a.map(function(x){return '<option value="'+x[0]+'"'+(String(v)===String(x[0])?' selected':'')+'>'+x[1]+'</option>'}).join("")}
 openSheet('<h2>Фильтры</h2><label for="fs">Сортировать</label><select id="fs">'+op([["km","Сначала ближайшие"],["p","Сначала дороже"],["m","Ближе к метро"]],S.sort)+'</select><label for="fp">Оплата от, ₽</label><input id="fp" type="number" min="0" value="'+(S.min||"")+'" placeholder="1000"><label for="fk">Расстояние</label><select id="fk">'+op([[0,"Любое"],[3,"до 3 км"],[5,"до 5 км"],[10,"до 10 км"]],S.maxKm)+'</select><label for="fm">От метро пешком</label><select id="fm">'+op([[0,"Любое"],[5,"до 5 мин"],[10,"до 10 мин"],[15,"до 15 мин"]],S.maxM)+'</select><label for="fa">Возраст</label><select id="fa">'+op([["all","Любой"],["14","Только с 14 лет"],["18","Только 18+"]],S.age)+'</select><div style="height:14px"></div><button class="btn" id="fok">Показать заказы</button><div style="height:8px"></div><button class="btn sec" id="frs">Сбросить</button>');
 $("fok").onclick=function(){S.sort=$("fs").value;S.min=parseInt($("fp").value,10)||0;S.maxKm=+$("fk").value;S.maxM=+$("fm").value;S.age=$("fa").value;closeSheet();render()};
 $("frs").onclick=function(){S.sort="km";S.min=S.maxKm=S.maxM=0;S.age="all";S.cat="Все";S.urg=S.rem=false;closeSheet();render()};
}
function createForm(){
 var cx="";for(var i=0;i<=10;i++)cx+='<option>'+i+'</option>';
 openSheet('<h2>Новый заказ</h2><div class="meta">Шаблоны:</div><div class="chips" style="padding:4px 0 0">'+TPL.map(function(t,i){return '<button class="chip" data-a="tpl:'+i+'">'+t[0]+'</button>'}).join("")+'</div><label for="n_t">Что нужно сделать</label><input id="n_t" placeholder="Выгулять собаку"><label for="n_c">Категория</label><select id="n_c">'+CATS.map(function(c){return '<option>'+c+'</option>'}).join("")+'</select><label for="n_a">Адрес</label><input id="n_a" placeholder="Улица, дом, квартира"><label for="n_dt">Дата</label><input id="n_dt" placeholder="9 октября"><label for="n_w">Время</label><input id="n_w" placeholder="10:00"><label for="n_p">Цена, ₽</label><input id="n_p" type="number" min="100" placeholder="1000"><div class="meta" id="n_h" style="margin-top:6px"></div><label for="n_x">Сложность задачи (0–10)</label><select id="n_x">'+cx+'</select><label for="n_k">Сколько исполнителей нужно</label><select id="n_k"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select><label for="n_rp">Повторять заказ</label><select id="n_rp"><option value="">Не повторять</option><option>каждый день</option><option>каждую неделю</option><option>раз в месяц</option></select><label class="chk"><input type="checkbox" id="n_ur"> Срочный заказ: +30% к цене, его увидят первыми</label><label class="chk"><input type="checkbox" id="n_rm"> Удалённая работа (можно сделать из дома)</label><label for="n_l">Время на выполнение, мин</label><input id="n_l" type="number" min="15" placeholder="60"><label for="n_n">Примечания к исполнителю</label><textarea id="n_n" rows="2" placeholder="Например: нужен аккуратный человек, лучше пожилой"></textarea><div style="height:14px"></div><button class="btn" id="n_go">Опубликовать</button>');
 hint();
 $("n_go").onclick=function(){
  var t=$("n_t").value.trim(),p=parseInt($("n_p").value,10);if(!t||!p||p<100){toast("Укажите задачу и цену от 100 ₽");return}
  var u=$("n_ur").checked?Math.round(p*.3/50)*50:0,rm=$("n_rm").checked,o={s:0,rem:rm?1:0,id:S.nid++,t:t,c:$("n_c").value,p:p+u,dt:$("n_dt").value||"Дата уточняется",w:$("n_w").value||"",d:rm?"Удалённо":"Рядом",ad:rm?"Онлайн":($("n_a").value||"Адрес уточняется"),st:"Ближайшее",km:rm?99:.5,m:rm?99:5,age:18,lim:parseInt($("n_l").value,10)||60,cx:+$("n_x").value,ub:u,cu:3,need:+$("n_k").value,rp:$("n_rp").value,la:55.75+Math.random()*.03,lo:37.6+Math.random()*.04,x:120+Math.random()*60,y:120+Math.random()*60,x2:"Ваш заказ.",nt:$("n_n").value.trim()};
  orders.unshift(o);S.my.unshift(o);closeSheet();S.tab="my";toast("Заказ опубликован");render();
 };
}

 openSheet('<h2>Вывод денег</h2><div class="meta">Доступно: '+rub(S.bal)+'</div><label for="wa">Сколько вывести, ₽</label><input id="wa" type="number" min="1" placeholder="1000"><div style="height:14px"></div><button class="btn" id="wgo">Вывести</button><div style="height:8px"></div><button class="btn sec" id="wall">Вывести всё</button>');

document.addEventListener("click",function(e){
 var el=e.target.closest("[data-open],[data-cat],[data-view],[data-filter],[data-tab],[data-role],[data-pick],[data-apply],[data-fin],[data-conf],[data-cfin],[data-sl],[data-slb],[data-slx],[data-slok],[data-revs],[data-cust],[data-x],[data-urg],[data-rem],[data-dem],[data-chat],[data-where],[data-send],[data-mic],[data-play],[data-a],#rgs,#wd,#cp");if(!el)return;var d=el.dataset;
 if(d.x)closeSheet();

 else if(d.conf){var m=S.mine[+d.conf];m.s=3;S.bal+=wp(m.o);toast("+"+rub(wp(m.o))+" на баланс");render()}
 else if(d.cfin){S.my[+d.cfin].s=2;toast("Выполнение подтверждено");render()}
 else if(d.sl){S.st=d.sl;render()}
 else if(d.slb){S.bk[d.slb]="b";toast("Слот забронирован. Подтвердите его за 12 часов до начала");render()}
 else if(d.slx){delete S.bk[d.slx];render()}
 else if(d.slok){S.bk[d.slok]="ok";toast("Участие подтверждено");render()}
 else if(d.revs)revSheet(d.revs);
 else if(d.cust)custSheet(+d.cust);

 else if(d.rem){S.rem=!S.rem;render()}

 else if(d.chat){var k=d.chat,ix=+k.slice(1);chatOpen(k,k[0]==="w"?CU[S.mine[ix].o.cu].n:S.my[ix].ex)}
 else if(d.where)whereSheet(+d.where)
 else if(d.send)send()
 else if(d.mic)mic()
 else if(d.play){var pm=CH[CHK][+d.play];if(pm.v)new Audio(pm.v).play();else toast("Демо: голосовое без записи")}
 else if(el.id==="rgs"){S.region=$("rg").value;toast("Регион сохранён")}
 else if(el.id==="wd")wdSheet();
 else if(el.id==="cp"){try{navigator.clipboard.writeText("DELO-7K2M")}catch(x){}toast("Код скопирован")}
});

 if(t.dataset&&t.dataset.ph&&t.files&&t.files[0]){var k=t.dataset.ph[0],i=+t.dataset.ph.slice(1);S.mine[i].ph[k].push(URL.createObjectURL(t.files[0]));render()}
