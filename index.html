body{background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-weight:500;line-height:1.4}
.app{max-width:560px;margin:0 auto;padding:0 14px 96px}
header{padding:16px 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1,h2,.brand{font-family:"Cormorant Garamond",Georgia,serif}
h1{font-size:30px;margin:0;font-weight:700}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}

.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}

nav button{background:none;border:0;padding:10px 0 8px;font-size:12px;font-weight:700;color:var(--mute);cursor:pointer}
nav button.on{color:var(--pri)}
nav button span{display:block;font-size:20px;line-height:1.1}
nav .plus{background:var(--pri);color:var(--onpri);border-radius:12px;width:48px;height:48px;margin:0 auto;font-size:28px;padding:0}
.sheet-bg{position:fixed;inset:0;background:rgba(20,12,4,.55);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet-bg.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto}
.sheet h2{margin:0 0 6px;font-size:26px}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
.note{background:var(--bg);border-radius:10px;padding:12px;font-size:14px;margin:12px 0}
.prog{height:6px;border-radius:3px;background:var(--line);margin:6px 0}
.prog i{display:block;height:100%;border-radius:3px;background:var(--gold)}
.big{font-family:"Cormorant Garamond",Georgia,serif;font-size:40px;font-weight:700;line-height:1.1}
.timer{font-weight:800;color:var(--pri);font-size:20px}

.empty{text-align:center;color:var(--mute);padding:30px 10px}
.empty .btn{margin-top:14px}
.who{display:flex;gap:12px;align-items:center}
.stars{color:var(--gold);letter-spacing:1px}
.map{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
.land{fill:var(--card)}.park{fill:var(--park)}.river{fill:none;stroke:var(--river);stroke-width:7;stroke-linecap:round}
.rd{stroke:var(--line);stroke-width:2;fill:none}.rd2{stroke:var(--line);stroke-width:1;fill:none}
.ring{fill:none;stroke:var(--mute);stroke-width:2}.ring2{fill:none;stroke:var(--mute);stroke-width:1;stroke-dasharray:4 4}
.mt{fill:#D0342C}.lb{font-size:6.5px;fill:var(--mute);font-weight:700;font-family:Manrope,sans-serif}.pt{font-size:7.5px;font-weight:800;fill:#fff;font-family:Manrope,sans-serif;pointer-events:none}
.pin{cursor:pointer}
#lmap{height:62vh;min-height:320px;border-radius:12px;border:1px solid var(--line);position:relative;z-index:0}
.mk{background:#8A641F;color:#fff;border:2px solid #fff;border-radius:14px;font:800 12px Manrope,sans-serif;padding:3px 7px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.4);white-space:nowrap}
.mk.t{background:#C9772E}
.x{position:sticky;top:0;float:right;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;line-height:1;cursor:pointer;margin:0 0 6px 8px;z-index:2}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px;color:var(--mute)}
.leg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
</style>
</head>

function timerTxt(ms){if(ms<=0)return"время вышло";var s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60);s%=60;return(h?h+":":"")+("0"+m).slice(-2)+":"+("0"+s).slice(-2)}

function slotsV(){
 var mine=Object.keys(S.bk).length,h='<header><h1>Слоты</h1></header><div class="bar2"><div class="seg"><button class="'+(S.st==="all"?'on':'')+'" data-sl="all">Свободные</button><button class="'+(S.st==="my"?'on':'')+'" data-sl="my">Мои слоты ('+mine+')</button></div></div>';

 }
 var dts=["9 октября","10 октября"];
 return h+dts.map(function(d){var l=SL.filter(function(s){return s.dt===d&&!S.bk[s.id]});return '<div class="meta" style="margin:12px 0 8px"><b>'+d+' · свободно слотов: '+l.length+'</b></div>'+l.map(function(s){return '<div class="card"><div class="row"><div><h3>'+s.a+'</h3><div class="meta">'+s.f+':00–'+s.t+':00 · '+hrs(s)+' ч</div></div><div style="text-align:right"><div class="price">от '+rub(s.h*hrs(s))+'</div><div class="meta">гарантия '+s.h+' ₽/час</div></div></div><div style="height:10px"></div><button class="btn sec" data-slb="'+s.id+'">Забронировать</button></div>'}).join("")}).join("");

function profV(){
 var n=S.mine.filter(function(m){return m.s===3}).length,bonus=(n>=1?300:0)+(n>=5?1000:0)+(n>=10?1500:0),w=S.role==="worker",l=w?WR:CU[3].rv;
 var held=S.mine.filter(function(m){return m.s<3}).reduce(function(a,m){return a+wp(m.o)},0);
 var h='<header><div class="top"><h1>Профиль</h1><span class="brand">ДЕЛО</span></div></header><div class="card"><div class="who">'+av(56)+'<div><h3 style="font-size:19px;margin:0">Алексей К.</h3><button class="lnk" data-revs="'+(w?'w':'c')+'"><span class="stars">★</span> '+f1(avg(l))+' · '+l.length+' '+(l.length<5?'отзыва':'отзывов')+' ›</button></div></div><label>Режим</label><div class="seg"><button class="'+(S.pick==="worker"?'on':'')+'" data-pick="worker">Исполнитель</button><button class="'+(S.pick==="customer"?'on':'')+'" data-pick="customer">Заказчик</button></div>'+(S.pick!==S.role?'<div style="height:10px"></div><button class="btn" data-apply="1">Готово</button>':'')+'<label for="rg">'+(w?'Регион, где я работаю':'Регион, где мне нужна помощь')+'</label><select id="rg">'+REG.map(function(r){return '<option'+(r===S.region?' selected':'')+'>'+r+'</option>'}).join("")+'</select><div style="height:10px"></div><button class="btn sec" id="rgs">Сохранить регион</button></div>';

 h+='<div class="card"><h3>Пригласи друга</h3><div class="meta">Вы получаете 5% от первых 10 заказов друга. Друг, который выполнит 10 заказов в течение месяца после регистрации, получает 800 ₽.</div><div class="note"><b>Ваш код: DELO-7K2M</b></div><button class="btn sec" id="cp">Скопировать код</button></div>';

function myV(){

var LM=null;
function pl(o){var q=wp(o);return q>=1000?f1(q/1000)+"к":q}
function mapFallback(l){var e=$("lmap");if(LM){LM.remove();LM=null}if(e)e.outerHTML='<div class="meta" style="margin-bottom:8px">Настоящая карта здесь не загрузилась (она работает на опубликованном сайте), показываю схему.</div>'+mapSvg(l)}
function initMap(){
 var e=$("lmap");if(!e)return;var l=flt();
 if(LM){LM.remove();LM=null}
 if(typeof L==="undefined"||!l.length){if(l.length)mapFallback(l);return}
 try{
  LM=L.map("lmap",{zoomControl:true}).setView([55.75,37.62],10);
  var bad=0,tl=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"}).addTo(LM);
  tl.on("tileerror",function(){if(++bad===3)mapFallback(l)});
  var pts=[];
  l.forEach(function(o){pts.push([o.la,o.lo]);L.marker([o.la,o.lo],{icon:L.divIcon({className:"",html:'<div class="mk'+(o.age===14?' t':'')+'">'+pl(o)+'</div>',iconSize:[46,26],iconAnchor:[23,13]})}).addTo(LM).on("click",function(){detail(o.id)})});
  LM.fitBounds(pts,{padding:[30,30],maxZoom:12});
 }catch(x){mapFallback(l)}
}
function render(){

 var w=S.role==="worker";
 if(w&&S.tab==="my")S.tab="feed";if(!w&&(S.tab==="feed"||S.tab==="mine"||S.tab==="slots"))S.tab="my";
 $("app").innerHTML=S.tab==="feed"?feed():S.tab==="mine"?mineV():S.tab==="slots"?slotsV():S.tab==="my"?myV():profV();
 var it=w?[["feed","📋","Заказы"],["mine","✅","Мои"],["slots","🕒","Слоты"],["prof","👤","Профиль"]]:[["my","📦","Заказы"],["new","+",""],["prof","👤","Профиль"]];

function wdSheet(){

document.addEventListener("click",function(e){
 var el=e.target.closest("[data-open],[data-cat],[data-view],[data-filter],[data-tab],[data-role],[data-pick],[data-apply],[data-fin],[data-conf],[data-cfin],[data-sl],[data-slb],[data-slx],[data-slok],[data-revs],[data-cust],[data-x],#rgs,#wd,#cp");if(!el)return;var d=el.dataset;

 else if(d.tab){if(d.tab==="new")createForm();else{S.tab=d.tab;render();scrollTo(0,0)}}
 else if(d.role){S.role=S.pick=d.role;S.tab=d.role==="worker"?"feed":"my";closeSheet();render()}
 else if(d.pick){S.pick=d.pick;render()}
 else if(d.apply){S.role=S.pick;S.tab="prof";toast("Режим переключён");render()}
 else if(d.fin){S.mine[+d.fin].s=1;render()}
 else if(d.conf){var m=S.mine[+d.conf];m.s=3;S.bal+=wp(m.o);toast("+"+rub(wp(m.o))+" на баланс");render()}
 else if(d.cfin){S.my[+d.cfin].fin=1;render()}
 else if(d.sl){S.st=d.sl;render()}

 else if(d.revs)revSheet(d.revs);
 else if(d.cust)custSheet(+d.cust);
 else if(el.id==="rgs"){S.region=$("rg").value;toast("Регион сохранён")}
 else if(el.id==="wd")wdSheet();
 else if(el.id==="cp"){try{navigator.clipboard.writeText("DELO-7K2M")}catch(x){}toast("Код скопирован")}
});
document.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.open){e.preventDefault();detail(+e.target.dataset.open)}});
