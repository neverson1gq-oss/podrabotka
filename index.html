function act7(n,v){
 if(n==="authsubmit"){authSubmit(v);return true}
 else if(n==="authmode"){authSheet(v);return true}
 else if(n==="pal"){setSheet()}
 else if(n==="cat"){$("n_c").value=v;syncForm();hint()}
 else if(n==="pm"){$("n_pm").value=v;syncPm()}
 else if(n==="kq"){var k=Math.max(1,Math.min(9,(+$("n_k").value||1)+(+v)));$("n_k").value=k;$("n_kt").textContent=k}
 else if(n==="cmp"){var q=v.split(":");cmpSheet(q[0],+q[1])}
 else if(n==="cmpl")complaintSheet(v)
 else if(n==="csend"){closeSheet();toast("Жалоба отправлена. Спасибо, что помогаете сделать сервис безопаснее")}
 else if(n==="rrep")rrepSheet(+v)
 else if(n==="rsend"){var t=($("rr_t").value||"").trim();if(!t){toast("Напишите ответ");return true}WR[S.rr][3]=t;revSheet("w");toast("Ответ опубликован")}
 else return false;
 return true}

 if(t.id==="rph"&&t.files&&t.files[0]){S.rph=URL.createObjectURL(t.files[0]);$("rpv").innerHTML='<img class="pv" src="'+S.rph+'" alt="Фото к отзыву">'}});
